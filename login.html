<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Saúde Votorantim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 p-4">

    <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-xl border border-white">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-blue-900 mb-2">Acesso Restrito</h1>
            <p class="text-slate-500 text-sm">Portal exclusivo para profissionais da Saúde e ADM da Prefeitura de Votorantim.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">E-mail Corporativo</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                    placeholder="nome@votorantim.sp.gov.br">
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Senha</label>
                <input type="password" id="password" required
                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:outline-none transition-all"
                    placeholder="••••••••">
            </div>

            <div id="errorMsg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-lg border border-red-100">
                Credenciais inválidas.
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="index.html" class="text-sm text-blue-600 hover:underline font-medium">Voltar para a página pública</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerText = 'Autenticando...';
            errorMsg.classList.add('hidden');

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Verificar perfil
                const authData = await checkAuth();
                
                if (authData && authData.role === 'adm') {
                    window.location.href = 'admin.html';
                } else if (authData && authData.role === 'saude') {
                    window.location.href = 'saude.html';
                } else {
                    throw new Error("Perfil de acesso não configurado. Contate o administrador.");
                }

            } catch (err) {
                errorMsg.innerText = err.message || "E-mail ou senha incorretos.";
                errorMsg.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = 'Entrar no Sistema';
                
                // Força logout se não tiver role
                if (err.message.includes("Perfil de acesso não configurado")) {
                    await supabase.auth.signOut();
                }
            }
        });
        
        // Se já estiver logado, redireciona
        window.addEventListener('DOMContentLoaded', async () => {
            const authData = await checkAuth();
            if (authData) {
                if(authData.role === 'adm') window.location.href = 'admin.html';
                if(authData.role === 'saude') window.location.href = 'saude.html';
            }
        });
    </script>
</body>
</html>

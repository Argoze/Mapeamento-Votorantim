<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde Votorantim - Alertas e Campanhas</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .text-gradient {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>

<body class="text-slate-800 antialiased relative min-h-screen overflow-x-hidden">

    <!-- Decorative background blobs -->
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-blue-50 to-transparent -z-10"></div>
    <div
        class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-blue-100 opacity-50 blur-[80px] -z-10 pointer-events-none">
    </div>

    <!-- Navegação -->
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <a href="index.html" class="inline-flex items-center gap-2 text-blue-600 hover:text-blue-800 font-semibold transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Voltar para o Mapa
        </a>
    </nav>

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <header class="mb-10 flex flex-col sm:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">
                    <span class="text-gradient">Alertas e Campanhas</span>
                </h1>
                <p class="text-slate-500 text-lg">Fique por dentro dos mutirões e eventos de saúde em Votorantim.</p>
            </div>
            
            <!-- Botão restrito para ADM/Saúde -->
            <a href="login.html" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-5 rounded-xl shadow-md transition-all flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Novo Evento
            </a>
        </header>

        <!-- Lista de Eventos -->
        <div id="eventList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Loader -->
            <div class="col-span-1 md:col-span-2 text-center text-slate-500 py-10">
                Carregando campanhas...
            </div>
        </div>
    </div>
            
    <script>
        async function loadEvents() {
            const eventList = document.getElementById('eventList');
            try {
                const { data, error } = await supabase
                    .from('eventos')
                    .select('*')
                    .order('criado_em', { ascending: false });

                if (error) throw error;

                if (!data || data.length === 0) {
                    eventList.innerHTML = `
                        <div class="col-span-1 md:col-span-2 text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
                            <h3 class="text-lg font-semibold text-slate-700">Nenhum evento no momento</h3>
                            <p class="text-slate-500">A prefeitura não possui campanhas ativas.</p>
                        </div>
                    `;
                    return;
                }

                eventList.innerHTML = '';
                data.forEach(evento => {
                    const colorClass = evento.tipo === 'Urgente' ? 'red' : 'blue';
                    const iconPath = evento.tipo === 'Urgente' 
                        ? 'M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z'
                        : 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';

                    eventList.innerHTML += `
                        <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200 relative overflow-hidden group hover:shadow-md transition-shadow">
                            <div class="absolute top-0 right-0 bg-${colorClass}-500 text-white text-xs font-bold px-3 py-1 rounded-bl-lg uppercase">
                                ${evento.tipo}
                            </div>
                            <div class="flex items-start gap-4">
                                <div class="h-12 w-12 bg-${colorClass}-100 rounded-full flex items-center justify-center flex-shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-${colorClass}-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}" />
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="text-xl font-bold text-slate-800">${evento.titulo}</h3>
                                    <p class="text-slate-600 mt-2 text-sm">${evento.descricao}</p>
                                    
                                    <div class="mt-4 flex flex-col gap-2">
                                        <div class="flex items-center gap-2 text-sm text-slate-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                                            </svg>
                                            <strong>Data:</strong> ${evento.data_evento}
                                        </div>
                                        <div class="flex items-center gap-2 text-sm text-slate-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                            </svg>
                                            <strong>Local:</strong> ${evento.local_evento}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });

            } catch (err) {
                console.error("Erro ao carregar eventos", err);
                eventList.innerHTML = `<div class="col-span-2 text-red-500 text-center">Erro ao conectar com o banco de dados.</div>`;
            }
        }

        window.addEventListener('DOMContentLoaded', loadEvents);
    </script>
</body>
</html>

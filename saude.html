<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel da Saúde - Votorantim</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-10">

    <nav class="bg-blue-600 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-white font-bold text-xl">Painel da Saúde</span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-blue-100 text-sm hidden sm:inline-block">Perfil: Profissional de Saúde</span>
                    <button onclick="logout()" class="bg-blue-700 hover:bg-blue-800 text-white px-3 py-2 rounded-md text-sm font-medium transition">Sair</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
            <!-- Criar Novo Evento -->
            <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold text-slate-800 mb-6 border-b pb-2">Publicar Novo Alerta / Campanha</h2>
                
                <form id="eventoForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Título</label>
                        <input type="text" id="ev_titulo" required class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Descrição</label>
                        <textarea id="ev_desc" required rows="3" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Data/Horário</label>
                            <input type="text" id="ev_data" required placeholder="Ex: 20 de Maio, 08h às 16h" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-1">Local</label>
                            <input type="text" id="ev_local" required placeholder="Ex: UBS Vila Nova" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Tipo de Aviso</label>
                        <select id="ev_tipo" class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="Informativo">Informativo (Azul)</option>
                            <option value="Urgente">Urgente (Vermelho)</option>
                        </select>
                    </div>
                    
                    <div id="ev_msg" class="text-sm font-semibold hidden"></div>

                    <button type="submit" id="ev_btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-all">
                        Publicar Campanha
                    </button>
                </form>
            </div>
            
            <div class="space-y-6">
                <!-- Links Úteis -->
                <div class="glass-panel p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h2 class="text-xl font-bold text-slate-800 mb-4">Acesso Rápido</h2>
                    <div class="flex gap-4">
                        <a href="eventos.html" target="_blank" class="text-blue-600 hover:underline">Visualizar portal de Campanhas</a>
                        <a href="index.html" target="_blank" class="text-blue-600 hover:underline">Ver mapa da cidade</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        // Verifica segurança
        window.addEventListener('DOMContentLoaded', async () => {
            const authData = await checkAuth();
            if (!authData || (authData.role !== 'saude' && authData.role !== 'adm')) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = authData.user;
        });

        // Adicionar evento
        document.getElementById('eventoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('ev_btn');
            const msg = document.getElementById('ev_msg');
            
            btn.disabled = true;
            btn.innerText = 'Publicando...';
            
            try {
                const { error } = await supabase.from('eventos').insert([
                    {
                        titulo: document.getElementById('ev_titulo').value,
                        descricao: document.getElementById('ev_desc').value,
                        data_evento: document.getElementById('ev_data').value,
                        local_evento: document.getElementById('ev_local').value,
                        tipo: document.getElementById('ev_tipo').value,
                        criado_por: currentUser.id
                    }
                ]);

                if (error) throw error;

                msg.innerText = "Campanha publicada com sucesso!";
                msg.className = "text-sm font-semibold text-green-600 block";
                document.getElementById('eventoForm').reset();
            } catch (err) {
                console.error(err);
                msg.innerText = "Erro ao publicar: " + err.message;
                msg.className = "text-sm font-semibold text-red-600 block";
            } finally {
                btn.disabled = false;
                btn.innerText = 'Publicar Campanha';
                setTimeout(() => msg.classList.add('hidden'), 5000);
            }
        });
    </script>
</body>
</html>

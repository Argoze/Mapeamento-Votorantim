<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saúde Votorantim - Mapeamento de Unidades</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
        }

        #map {
            height: 550px;
            width: 100%;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .custom-popup b {
            color: #1e3a8a;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .loader {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid #ffffff;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Gradient text */
        .text-gradient {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Range slider styling */
        input[type=range] {
            accent-color: #2563eb;
        }
    </style>
</head>

<body class="text-slate-800 antialiased relative min-h-screen overflow-x-hidden">

    <!-- Decorative background blobs -->
    <div class="absolute top-0 left-0 w-full h-96 bg-gradient-to-b from-blue-50 to-transparent -z-10"></div>
    <div
        class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] rounded-full bg-blue-100 opacity-50 blur-[80px] -z-10 pointer-events-none">
    </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <header class="mb-10 text-center sm:text-left flex flex-col sm:flex-row justify-between items-center gap-6">
            <div>
                <h1 class="text-4xl font-extrabold tracking-tight text-slate-900 mb-2">
                    <span class="text-gradient">Saúde Votorantim</span>
                </h1>
                <p class="text-slate-500 text-lg">Encontre a unidade básica de saúde mais próxima de você</p>
            </div>
            <div
                class="bg-blue-50 px-4 py-2 rounded-full border border-blue-100 text-blue-800 font-semibold text-sm shadow-sm whitespace-nowrap">
                Rede de atendimento municipal
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Sidebar Controls -->
            <div class="lg:col-span-1 space-y-6">
                <div class="glass-panel p-6 rounded-2xl shadow-lg border border-slate-100">
                    <h2 class="text-lg font-bold text-slate-800 mb-5 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-600" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        Onde você está?
                    </h2>

                    <div class="space-y-5">
                        <!-- Busca por Endereço -->
                        <div>
                            <label class="block text-sm font-semibold text-slate-600 mb-2">Endereço de
                                referência</label>
                            <div class="flex flex-col gap-3">
                                <input type="text" id="addressInput" placeholder="Ex: Praça Zeca Padeiro"
                                    class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all shadow-sm">
                                <button onclick="searchAddress()" id="searchBtn"
                                    class="w-full bg-gradient-to-r from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 text-white font-semibold py-3 px-4 rounded-xl shadow-md shadow-blue-500/30 transition-all transform active:scale-[0.98]">
                                    Procurar no mapa
                                </button>
                            </div>
                        </div>

                        <div class="relative flex items-center py-2">
                            <div class="flex-grow border-t border-slate-200"></div>
                            <span class="flex-shrink-0 mx-4 text-slate-400 text-sm font-medium">OU</span>
                            <div class="flex-grow border-t border-slate-200"></div>
                        </div>

                        <!-- Busca por GPS -->
                        <button onclick="getUserLocation()"
                            class="w-full bg-white hover:bg-slate-50 border-2 border-slate-200 text-slate-700 font-semibold py-3 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-sm">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-blue-500" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z"
                                    clip-rule="evenodd" />
                            </svg>
                            Usar minha localização
                        </button>

                        <!-- Configuração do Raio -->
                        <div class="pt-4 border-t border-slate-100">
                            <label class="flex justify-between items-center text-sm font-semibold text-slate-600 mb-3">
                                Raio de busca
                                <span id="radiusVal"
                                    class="bg-blue-100 text-blue-700 py-1 px-3 rounded-full font-bold text-sm">3
                                    km</span>
                            </label>
                            <input type="range" id="radiusRange" min="1" max="15" value="3"
                                class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                            <div class="flex justify-between text-xs text-slate-400 mt-2 font-medium">
                                <span>1 km</span>
                                <span>15 km</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Status info -->
                <div
                    class="glass-panel p-5 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between">
                    <div class="text-sm font-medium text-slate-600">
                        Unidades no raio:
                    </div>
                    <div id="count"
                        class="h-10 w-10 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-lg shadow-md shadow-blue-500/40">
                        0
                    </div>
                </div>
            </div>

            <!-- Mapa -->
            <div class="lg:col-span-2 relative z-0">
                <div class="relative rounded-2xl overflow-hidden bg-white p-1 shadow-xl border border-slate-100">
                    <div id="map"></div>
                </div>
            </div>
        </div>

        <!-- Lista de Resultados -->
        <div class="mt-12">
            <h2 class="text-2xl font-bold text-slate-800 mb-6 flex items-center gap-2">
                Unidades próximas
                <span class="text-sm font-normal text-slate-500 bg-slate-100 px-3 py-1 rounded-full">(Ordenadas por
                    proximidade)</span>
            </h2>
            <div id="resultList" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                <!-- Cards preenchidos via JavaScript -->
            </div>
            <div id="emptyState"
                class="hidden text-center py-16 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="mx-auto w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-slate-400" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </div>
                <h3 class="text-lg font-semibold text-slate-700 mb-1">Nenhuma unidade encontrada</h3>
                <p class="text-slate-500">Tente aumentar a distância de busca ou pesquise outro endereço.</p>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Dados injetados automaticamente
        const unidades = [
            {
                "nome": "UBS Vila Nova",
                "endereco": "Av. Pedro Augusto Rangel, 1925, Vila Nova",
                "lat": -23.5385391,
                "lng": -47.4156902
            },
            {
                "nome": "UBS Vila Garcia",
                "endereco": "Av. Izabel Ferreira Coelho, 271, Vila Garcia",
                "lat": -23.5512,
                "lng": -47.432
            },
            {
                "nome": "UBS Rio Acima",
                "endereco": "Av. Octávio Augusto Rangel, 1282, Jardim Toledo",
                "lat": -23.5277651,
                "lng": -47.4402925
            },
            {
                "nome": "UBS Barra Funda",
                "endereco": "Rua Lopes Chaves, S/N, Barra Funda",
                "lat": -23.5461177,
                "lng": -47.4383105
            },
            {
                "nome": "UBS Bela Vista",
                "endereco": "Av. São João, 867, Centro",
                "lat": -23.535,
                "lng": -47.442
            },
            {
                "nome": "Hospital Municipal",
                "endereco": "Rua João Walter, 181, Centro",
                "lat": -23.538,
                "lng": -47.445
            },
            {
                "nome": "UPA Central",
                "endereco": "Rua Antônio Walter, 66-146, Centro",
                "lat": -23.5375,
                "lng": -47.446
            },
            {
                "nome": "UBS Clarice",
                "endereco": "Rua Mercedes Nardi Arcuri, S/N, Jardim Clarice",
                "lat": -23.5532,
                "lng": -47.4411
            },
            {
                "nome": "UBS Itapeva",
                "endereco": "Rua João Santiago Figueira, 200, Jardim Itapeva",
                "lat": -23.5655,
                "lng": -47.438
            },
            {
                "nome": "UBS Novo Mundo",
                "endereco": "Rua Abílio Maia, 46, Jardim Novo Mundo",
                "lat": -23.5388857,
                "lng": -47.5039672
            },
            {
                "nome": "UBS Archila",
                "endereco": "Rua Lázara Bueno de Arruda, Jardim Archila",
                "lat": -23.5415,
                "lng": -47.4522
            },
            {
                "nome": "ESF Promorar",
                "endereco": "Rua Boaventura Maganhato, 138, São Matheus",
                "lat": -23.546,
                "lng": -47.441
            },
            {
                "nome": "ESF Cristal",
                "endereco": "Rua Anália Pereira, 762, Jardim Cristal",
                "lat": -23.5781298,
                "lng": -47.4694753
            },
            {
                "nome": "ESF Tatiana",
                "endereco": "Rua Adriano Maciel de Queiroz, 569, Jardim Tatiana",
                "lat": -23.544726,
                "lng": -47.4967263
            },
            {
                "nome": "ESF São João",
                "endereco": "Rua Zilda Tescaro Sbrana, Parque São João",
                "lat": -23.55,
                "lng": -47.42
            },
            {
                "nome": "ESF Green Valley",
                "endereco": "Rua José Raimundo da Silva, Green Valley",
                "lat": -23.558164,
                "lng": -47.4899802
            },
            {
                "nome": "ESF Amorim",
                "endereco": "Rua José Antônio de Mello, 81, Vila Amorim",
                "lat": -23.5560867,
                "lng": -47.4434317
            },
            {
                "nome": "UBS Serrano",
                "endereco": "Rua Francisco Lopes de Almeida, 76, Jardim Palmira",
                "lat": -23.5605,
                "lng": -47.4541
            }
        ];

        // Configuração Inicial do Mapa
        const map = L.map('map', { zoomControl: false }).setView([-23.545, -47.44], 13);

        // Reposicionar controle de zoom
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Estilo de mapa limpo e moderno (Positron)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        }).addTo(map);

        let centerMarker = null;
        let radiusCircle = null;
        let markersGroup = L.layerGroup().addTo(map);

        const radiusInput = document.getElementById('radiusRange');
        const radiusDisplay = document.getElementById('radiusVal');

        radiusInput.addEventListener('input', () => {
            radiusDisplay.innerText = radiusInput.value + " km";
            if (centerMarker) updateSearch();
        });

        // Ícone padronizado para as unidades
        const clinicIcon = L.divIcon({
            html: `<div style="background-color: #3b82f6; width: 24px; height: 24px; border-radius: 50%; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.3);"></div>`,
            className: '',
            iconSize: [24, 24],
            iconAnchor: [12, 12]
        });

        async function searchAddress() {
            const query = document.getElementById('addressInput').value;
            const btn = document.getElementById('searchBtn');

            if (!query) {
                alert("Por favor, digite um endereço.");
                return;
            }

            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loader"></span> Buscando...';
            btn.disabled = true;

            try {
                const searchUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Votorantim, SP')}`;
                const response = await fetch(searchUrl);
                const results = await response.json();

                if (results.length > 0) {
                    const { lat, lon } = results[0];
                    setMapCenter(parseFloat(lat), parseFloat(lon), "Seu Local de Referência");
                } else {
                    alert("Endereço não encontrado em Votorantim. Tente ser mais específico.");
                }
            } catch (error) {
                console.error(error);
                alert("Erro ao buscar endereço. Verifique sua conexão.");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        function getUserLocation() {
            if (!navigator.geolocation) {
                alert("Seu navegador não suporta geolocalização.");
                return;
            }

            navigator.geolocation.getCurrentPosition((position) => {
                const { latitude, longitude } = position.coords;
                setMapCenter(latitude, longitude, "Sua Localização Atual");
            }, (error) => {
                alert("Não foi possível acessar seu GPS. Tente digitar um endereço.");
            });
        }

        function setMapCenter(lat, lng, label) {
            if (centerMarker) map.removeLayer(centerMarker);
            if (radiusCircle) map.removeLayer(radiusCircle);

            const centerIcon = L.divIcon({
                html: `<div style="background-color: #ef4444; width: 28px; height: 28px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.3); display:flex; align-items:center; justify-content:center;"><div style="width:8px; height:8px; background:white; border-radius:50%"></div></div>`,
                className: '',
                iconSize: [28, 28],
                iconAnchor: [14, 14],
                popupAnchor: [0, -14]
            });

            centerMarker = L.marker([lat, lng], { icon: centerIcon }).addTo(map)
                .bindPopup(`<b style="color:#b91c1c">${label}</b>`, { className: 'custom-popup' }).openPopup();

            map.setView([lat, lng], 14);
            updateSearch();
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        function updateSearch() {
            if (!centerMarker) return;

            const centerCoords = centerMarker.getLatLng();
            const radiusKm = parseFloat(radiusInput.value);

            if (radiusCircle) map.removeLayer(radiusCircle);
            radiusCircle = L.circle(centerCoords, {
                color: '#3b82f6',
                weight: 2,
                fillColor: '#60a5fa',
                fillOpacity: 0.15,
                radius: radiusKm * 1000
            }).addTo(map);

            markersGroup.clearLayers();
            const resultList = document.getElementById('resultList');
            const emptyState = document.getElementById('emptyState');
            resultList.innerHTML = '';

            // Calculate distances and filter
            let unidadesProximas = [];

            unidades.forEach(unidade => {
                unidade.dist = calculateDistance(centerCoords.lat, centerCoords.lng, unidade.lat, unidade.lng);
                if (unidade.dist <= radiusKm) {
                    unidadesProximas.push(unidade);
                }
            });

            // Sort by proximity
            unidadesProximas.sort((a, b) => a.dist - b.dist);

            document.getElementById('count').innerText = unidadesProximas.length;

            if (unidadesProximas.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                unidadesProximas.forEach((unidade, index) => {
                    // Highlight the closest one
                    const isClosest = index === 0;

                    L.marker([unidade.lat, unidade.lng], { icon: clinicIcon })
                        .addTo(markersGroup)
                        .bindPopup(`<div style="padding:4px"><b style="color:#1e40af; font-size: 14px;">${unidade.nome}</b><br><span style="color:#64748b; font-size:12px">${unidade.endereco}</span><br><b style="color:#047857; margin-top:4px; display:inline-block">Distância: ${unidade.dist.toFixed(2)} km</b></div>`);

                    const cardHtml = `
                        <div class="bg-white p-5 rounded-2xl shadow-sm hover:shadow-md border border-slate-100 transition-all group flex flex-col h-full relative overflow-hidden">
                            ${isClosest ? '<div class="absolute top-0 right-0 bg-emerald-500 text-white text-[10px] font-bold px-3 py-1 rounded-bl-lg">MAIS PRÓXIMA</div>' : ''}
                            
                            <h3 class="font-bold text-slate-800 text-lg group-hover:text-blue-600 transition-colors pt-1">${unidade.nome}</h3>
                            <p class="text-sm text-slate-500 mt-2 flex-grow flex items-start gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-400 mt-0.5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                                </svg>
                                ${unidade.endereco}
                            </p>
                            
                            <div class="flex justify-between items-center mt-5 pt-4 border-t border-slate-50">
                                <div class="flex items-center gap-1.5 bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md text-sm font-bold">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                                    </svg>
                                    ${unidade.dist.toFixed(2)} km
                                </div>
                                <button onclick="map.setView([${unidade.lat}, ${unidade.lng}], 16)" 
                                    class="text-sm font-semibold text-blue-600 hover:text-blue-800 hover:bg-blue-50 px-3 py-1.5 rounded-lg transition-colors">
                                    Ver no mapa
                                </button>
                            </div>
                        </div>
                    `;
                    resultList.innerHTML += cardHtml;
                });
            }
        }

        // Mostrar todas as unidades inicialmente com opacidade para contexto
        unidades.forEach(u => {
            L.circleMarker([u.lat, u.lng], {
                radius: 6,
                fillColor: "#94a3b8",
                color: "#ffffff",
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.6
            }).addTo(map).bindPopup(`<b style="color:#475569">${u.nome}</b>`);
        });

        // Permitir busca com tecla Enter
        document.getElementById('addressInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAddress();
            }
        });

    </script>
</body>

</html>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Conecta cedo com o Supabase (API + Storage de imagens, mesmo domínio),
       pra encurtar DNS/TLS antes mesmo do React disparar o fetch dos dados
       e da imagem de capa (atual maior elemento de LCP da Home). -->
  <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin>
  <link rel="preconnect" href="%VITE_SUPABASE_URL%">
  <title>Votorantim Inteligente - Mapeamento da Rede Municipal</title>
  <script>
    (function () {
      try {
        var salvo = localStorage.getItem('votorantim-saude-tema');
        if (salvo === 'escuro') document.documentElement.classList.add('dark');
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
